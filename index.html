<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工業設備 1:1 AR 干涉檢驗系統</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
        model-viewer { width: 100%; height: 100%; }
        #ar-button {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            background-color: #007bff; color: white; border: none; border-radius: 30px;
            padding: 14px 28px; font-size: 16px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; display: flex; align-items: center; gap: 8px; z-index: 999;
        }
    </style>
</head>
<body>

    <!-- 這是正確的 Google 官方核心載入點 -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <!-- 3D 渲染標籤 -->
    <!-- 這裡假設您的方塊模型在 GitHub 最外層的名稱叫作 Cube.glb -->
    <model-viewer 
        src="./my_equipment.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed"
        ar-placement="floor"
        camera-controls 
        touch-action="pan-y"
        shadow-intensity="1" 
        exposure="1.5"
        alt="工業設備 AR 模型">
        
        <button slot="ar-button" id="ar-button">
            🔍 開啟現場 AR 1:1 干涉檢查
        </button>
    </model-viewer>

</body>
</html>


</body>
</html>
