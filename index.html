<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工業設備 1:1 AR 干涉檢驗系統</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
        /* 讓 3D 預覽畫面填滿手機螢幕 */
        model-viewer { width: 100%; height: 100%; }
        /* 自訂漂亮的 AR 啟動按鈕 */
        #ar-button {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            background-color: #007bff; color: white; border: none; border-radius: 30px;
            padding: 14px 28px; font-size: 16px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; display: flex; align-items: center; gap: 8px; z-index: 999;
        }
    </style>
</head>
<body>

    <!-- 載入 Google 官方 Model Viewer 核心元件 -->
    <script type="module" src="https://googleapis.com"></script>

    <!-- 3D 與 AR 核心標籤 -->
    <!-- 請將 src 中的 "my_equipment.glb" 改為您的模型檔名 -->
    <model-viewer 
        src="./my_equipment.glb" 
        ar 
        ar-modes="scene-viewer" 
        ar-scale="fixed"
        ar-placement="floor"
        camera-controls 
        touch-action="pan-y"
        shadow-intensity="1" 
        exposure="1"
        alt="工業設備 AR 模型">
        
        <!-- 當在支援 AR 的行動裝置開啟時，會顯示此按鈕 -->
        <button slot="ar-button" id="ar-button">
            開啟現場 AR 1:1 干涉檢查
        </button>
    </model-viewer>

</body>
</html>
