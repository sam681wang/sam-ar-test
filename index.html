<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工業設備 1:1 AR 多機型檢驗系統</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; background-color: #1a1a1a !important; }
        
        #ar-button {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            background-color: #007bff; color: white; border: none; border-radius: 30px;
            padding: 14px 28px; font-size: 16px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; z-index: 999;
        }

        .menu-container {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(0, 0, 0, 0.6); padding: 10px;
            border-radius: 8px; z-index: 1000; max-width: 90%; overflow-x: auto;
        }

        .menu-btn {
            background: #444; color: white; border: none; padding: 8px 16px;
            border-radius: 4px; cursor: pointer; font-size: 14px; white-space: nowrap;
            transition: background 0.3s;
        }

        /* 只有帶有 active 樣式的按鈕才會變綠色 */
        .menu-btn.active { background: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. 使用官方最標準、完全沒有 CORS 限制的載入點 -->
    <script type="module" src="https://googleapis.com"></script>

    <!-- 2. 頂部切換選單：請務必檢查此處的 data-model 檔名與您 GitHub 上的完全一模一樣 -->
    <div class="menu-container">
        <button class="menu-btn active" data-model="./my_equipment.glb">方塊</button>
        <button class="menu-btn" data-model="./machine_A.glb">設備 A (標準型)</button>
        <button class="menu-btn" data-model="./machine_B.glb">設備 B (加大型)</button>
        <button class="menu-btn" data-model="./machine_C.glb">設備 C (控制箱)</button>
    </div>

    <!-- 3. 3D 渲染標籤（最純粹的初始設定） -->
    <model-viewer 
        id="equipment-viewer"
        src="./my_equipment.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed"
        ar-placement="floor"
        camera-controls 
        touch-action="pan-y"
        shadow-intensity="1" 
        exposure="1.5"
        alt="工業設備 AR 模型">
        
        <button slot="ar-button" id="ar-button">
            🔍 開啟現場 AR 1:1 干涉檢查
        </button>
    </model-viewer>

    <!-- 4. 純粹、精準的 JavaScript 控制腳本 -->
    <script>
        const viewer = document.querySelector('#equipment-viewer');
        const buttons = document.querySelectorAll('.menu-btn');

        buttons.forEach(button => {
            button.addEventListener('click', (event) => {
                // 點擊任何按鈕時，先把全體按鈕的綠色高亮 (active) 徹底剝奪
                buttons.forEach(btn => btn.classList.remove('active'));
                
                // 只幫當前被點擊的那個按鈕加上綠色高亮
                button.classList.add('active');
                
                // 讀取該按鈕對應的模型路徑，並直接塞給 3D 檢視器
                const targetModel = button.getAttribute('data-model');
                
                console.log("正在切換模型至:", targetModel);
                viewer.setAttribute('src', targetModel);
            });
        });
    </script>

</body>
</html>
